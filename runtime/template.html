<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
{{RUNTIME_CSS}}
{{CANVAS_CSS}}
  </style>
</head>
<body data-mode="board">
  <header id="deck">
    <div class="deck-title"><span id="canvas-title"></span><span class="ver" id="ver-badge"></span></div>
    <div class="frame-picker">
      <button id="frame-picker-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="frame-picker-panel">
        <span class="picker-overline">Frame</span>
        <strong id="frame-picker-value">Select frame</strong>
        <span class="picker-chevron" aria-hidden="true">⌄</span>
      </button>
      <div id="frame-picker-panel" role="dialog" aria-label="Search frames" hidden>
        <label for="frame-search">Search frames</label>
        <input id="frame-search" type="search" placeholder="Search name, ID, summary" autocomplete="off">
        <nav id="frame-tabs" aria-label="Matching frames"></nav>
        <p id="frame-search-empty" hidden>No matching frames.</p>
      </div>
    </div>
    <div class="deck-actions" aria-label="Canvas tools">
      <div class="tool-group mode-tools" role="group" aria-label="View mode">
        <button id="mode-board" class="on" type="button" aria-pressed="true" title="Pan the whole canvas and pick a review target">Board</button>
        <button id="mode-interact" type="button" aria-pressed="false" title="Run scroll, hover and click inside the selected HTML frame">Run</button>
        <button id="library-btn" type="button" aria-pressed="false" title="Browse Design Library definitions and stories">UI Kit</button>
        <button id="rules-btn" type="button" aria-pressed="false" title="Review the common rules applied to every canvas change">Common rules <span id="rules-count"></span></button>
      </div>
      <div class="tool-group review-tools" role="group" aria-label="Review overlays">
        <button id="notes-btn" type="button" aria-pressed="false">Planning notes</button>
        <button id="comment-btn" type="button" aria-pressed="false"><span class="comment-glyph" aria-hidden="true"></span> Comments <span id="cmt-count"></span></button>
      </div>
      <div class="file-menu">
        <button id="file-menu-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="file-menu-panel">Feedback <span aria-hidden="true">⌄</span></button>
        <div id="file-menu-panel" role="menu" hidden>
          <button id="export-btn" type="button" role="menuitem">Save feedback</button>
          <button id="clear-resolved-comments" type="button" role="menuitem">Clear resolved</button>
          <button id="clear-all-comments" type="button" role="menuitem">Clear all comments</button>
          <button id="canvas-info-btn" type="button" role="menuitem">Canvas info</button>
        </div>
      </div>
    </div>
  </header>

  <div id="canvas" role="region" aria-label="Design canvas" tabindex="0">
    <main id="world"></main>
  </div>

  <section id="library-view" aria-labelledby="library-title" hidden>
    <aside class="library-sidebar">
      <p class="library-overline">Design Library</p>
      <h1 id="library-title"></h1>
      <p id="library-version"></p>
      <label for="library-search">Search library</label>
      <input id="library-search" type="search" placeholder="Search ID, name, prop, state" autocomplete="off">
      <nav id="library-nav" aria-label="Library categories">
        <button class="on" type="button" data-kind="all">All</button>
        <button type="button" data-kind="foundation">Foundations</button>
        <button type="button" data-kind="layout">Layouts</button>
        <button type="button" data-kind="component">Components</button>
      </nav>
    </aside>
    <main class="library-main">
      <header class="library-main-head">
        <div><p id="library-description"></p><strong id="library-counts"></strong></div>
        <button id="library-copy-all" type="button">Copy all definitions</button>
      </header>
      <div id="library-results"></div>
      <p id="library-empty" hidden>No matching library entries.</p>
    </main>
  </section>

  <section id="rules-view" aria-labelledby="rules-title" hidden>
    <aside class="rules-sidebar">
      <p class="rules-overline">Canvas Constitution</p>
      <h1 id="rules-title">Common rules</h1>
      <p id="rules-revision"></p>
      <label for="rules-search">Search rules</label>
      <input id="rules-search" type="search" placeholder="Search rule, category, applies to" autocomplete="off">
      <nav id="rules-nav" aria-label="Rule status">
        <button class="on" type="button" data-status="all">All</button>
        <button type="button" data-status="active">Active</button>
        <button type="button" data-status="proposed">Pending approval</button>
      </nav>
      <p class="rules-source" id="rules-source"></p>
    </aside>
    <main class="rules-main">
      <header class="rules-main-head">
        <div><p id="rules-description"></p><strong id="rules-counts"></strong></div>
        <button id="rules-copy-active" type="button">Copy active rules</button>
      </header>
      <div id="rules-results"></div>
      <p id="rules-empty" hidden>No matching common rules.</p>
    </main>
  </section>

  <div id="mode-hint" aria-live="polite">Board review · select a frame and press Enter to run it.</div>
  <aside id="action-inspector" aria-labelledby="action-inspector-title" tabindex="-1">
    <button id="action-inspector-close" type="button" aria-label="Close action details">×</button>
    <p class="inspector-kicker">User action</p>
    <h2 id="action-inspector-title"></h2>
    <code id="action-inspector-id"></code>
    <div id="action-inspector-notes"></div>
  </aside>
  <div id="transition-status" role="status" aria-live="polite"></div>

  <div id="zoom-hud" aria-label="Canvas zoom">
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-fit" type="button">Fit</button>
    <button id="zoom-100" type="button">100%</button>
    <span id="zoom-pct">100%</span>
    <button id="zoom-in" type="button" aria-label="Zoom in">＋</button>
  </div>

  <div id="popover" role="dialog" aria-label="Comment"></div>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <button class="modal-close" type="button">Close</button>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="application/json" id="canvas-data">{{CANVAS_DATA}}</script>
  <script>
{{PZ_CANVAS_JS}}
  </script>
  <script>
{{FEEDBACK_JS}}
  </script>
  <script>
{{BOARD_JS}}
  </script>
  <script>
{{LIBRARY_JS}}
  </script>
  <script>
{{RULES_JS}}
  </script>
</body>
</html>
