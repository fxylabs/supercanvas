<div class="reading-app" aria-label="Reading list screen">
  <header class="reading-header">
    <h1>Reading list</h1>
    <button class="sc-button" type="button" data-ui="ui-button" data-toast="The add flow lives in a separate Frame">Add book</button>
  </header>
  <main class="reading-list" aria-label="Saved books">
    <article class="sc-book-card" data-ui="ui-book-card" tabindex="0" data-action="action-open-book" aria-label="Open Demian detail">
      <strong>Demian</strong>
      <span>Hermann Hesse</span>
      <small class="reading-progress is-reading">Reading · 132/248 pages</small>
    </article>
    <article class="sc-book-card" data-ui="ui-book-card" tabindex="0" data-toast="This book has no detail Frame yet">
      <strong>Walden</strong>
      <span>Henry David Thoreau</span>
      <small class="reading-progress">Not started</small>
    </article>
    <article class="sc-book-card" data-ui="ui-book-card" tabindex="0" data-toast="This book has no detail Frame yet">
      <strong>Cosmos</strong>
      <span>Carl Sagan</span>
      <small class="reading-progress is-done">Finished</small>
    </article>
  </main>
</div>
