<div class="reading-app" aria-label="읽기 목록 화면">
  <header class="reading-header">
    <h1>읽기 목록</h1>
    <button class="sc-button" type="button" data-ui="ui-button" data-toast="추가 흐름은 별도 Frame으로 만듭니다">책 추가</button>
  </header>
  <main class="reading-list" aria-label="저장한 책 목록">
    <article class="sc-book-card" data-ui="ui-book-card" tabindex="0" data-action="action-open-book" aria-label="데미안 상세 열기">
      <strong>데미안</strong>
      <span>헤르만 헤세</span>
      <small class="reading-progress is-reading">읽는 중 · 132/248쪽</small>
    </article>
    <article class="sc-book-card" data-ui="ui-book-card" tabindex="0" data-toast="이 책의 상세 Frame은 아직 없습니다">
      <strong>월든</strong>
      <span>헨리 데이비드 소로</span>
      <small class="reading-progress">읽기 전</small>
    </article>
    <article class="sc-book-card" data-ui="ui-book-card" tabindex="0" data-toast="이 책의 상세 Frame은 아직 없습니다">
      <strong>코스모스</strong>
      <span>칼 세이건</span>
      <small class="reading-progress is-done">완독</small>
    </article>
  </main>
</div>
