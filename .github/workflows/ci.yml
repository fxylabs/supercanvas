name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node bin/supercanvas.mjs help
      - run: node bin/supercanvas.mjs update --all examples
      - run: node test/review-roundtrip.mjs
      - run: npm pack --dry-run
