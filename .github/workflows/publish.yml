name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm >= 11.5.1; npm 12 rejects the pinned node
      - run: npm install -g npm@11
      - run: node bin/supercanvas.mjs update --all examples
      - run: npm publish
