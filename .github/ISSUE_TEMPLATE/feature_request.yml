name: Feature request
description: Propose a user workflow or product improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before proposing an implementation. Opening an issue is not approval to implement it. Wait for `status:accepted` and maintainer assignment before opening a pull request.

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to accomplish, and what breaks down today?
      placeholder: When an agent updates a canvas, I cannot ...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result without prescribing the implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI commands and registry
        - Canvas package schema and migration
        - Rendering and verify pipeline
        - Canvas runtime (browser interaction, feedback, rules)
        - Templates and scaffolding
        - Agent integration (context, skills)
        - Packaging and installation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: local-first
    attributes:
      label: Data and offline implications
      description: What data is created, where should it live in the canvas package, and what must keep working offline?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or prior art
      description: Existing workarounds, comparable tools, mockups, or related issues.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same proposal.
          required: true
        - label: This request describes a user problem, not only a preferred technology.
          required: true
